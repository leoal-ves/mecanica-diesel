<!doctype html>
<html lang="en" data-bs-theme="auto">

    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Serviços - Mecanica Diesel</title>
        <link rel="stylesheet" href="/css/style-home.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>

    <body>
        <div class="container-home">
            <div th:replace="~{fragments/componentes :: sidebar}"></div>

            <main class="conteudo-principal">
                <h1>Serviços</h1>
                <div class="mb-4 d-flex align-items-center gap-2">
                    <label class="form-label mb-0">Filtrar por Data:</label>
                    <input type="date" id="filtroData" class="form-control" style="max-width: 200px;">
                    <button id="btnLimpar" class="btn btn-secondary">Limpar</button>
                </div>
                <button type="button" class="btn btn-success" onclick="location.href='/servicos/novo'">Novo Serviço</button>
                
                <table class="table mt-3">
                    <thead>
                       <tr>
                            <th>ID</th>
                            <th>Cliente</th>
                            <th>Placa</th>
                            <th>Descrição</th>
                            <th>Data</th>
                            <th>Aviso</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaServicosBody">
                        </tbody>
                </table>
            </main>
        </div>

        <script src="/js/scriptServicos.js"></script>
    </body>

</html>
