<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Novo Veículo</title>
    <link rel="stylesheet" href="/css/style-home.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-home">
        <div th:replace="~{fragments/componentes :: sidebar}"></div>
        <main class="conteudo-principal">
            <h1>Novo Veículo</h1>
            <form id="veiculoForm">
                <div class="mb-3">
                    <label class="form-label">Cliente</label>
                    <select id="clienteSelect" class="form-select" required>
                        <option value="">Selecione um cliente...</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Modelo</label>
                    <input type="text" id="modelo" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Placa</label>
                    <input type="text" id="placa" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success">Salvar</button>
            </form>
        </main>
    </div>
    <script src="/js/scriptVeiculoForm.js"></script>
</body>
</html>
