<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sistema de Gestão - Mecânica Diesel - Novo Cliente</title>
        <link rel="stylesheet" href="/css/style-home.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>

    <body>
        <div class="container-home">
            <div th:replace="~{fragments/componentes :: sidebar}"></div>
            <main class="conteudo-principal">
                <h1>Novo Cliente</h1>
                <form id="clienteForm" action="/api/clientes" method="post">
                    <div class="mb-3">
                        <label for="exampleFormControlInput1" class="form-label">Nome</label>
                        <input class="form-control" type="text" placeholder="Default input"
                            aria-label="default input example" name="nome">
                    </div>
                    <div class="mb-3">
                        <label for="exampleFormControlInput1" class="form-label">Email</label>
                        <input type="email" class="form-control" id="exampleFormControlInput1"
                            placeholder="name@example.com" name="email">
                    </div>

                    <button type="submit" class="btn btn-success">Salvar</button>
                </form>
            </main>
        </div>

        <script src="/js/scriptNovoCliente.js"></script>

    </body>

</html>
