<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Serviço - Mecanica Diesel</title>
    <link rel="stylesheet" href="/css/style-home.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-home">
        <div th:replace="~{fragments/componentes :: sidebar}"></div>

        <main class="conteudo-principal">
            <h1>Cadastrar Novo Serviço</h1>
            
            <form id="formServico" class="mt-4">
                <div class="mb-3">
                    <label for="clienteSelect" class="form-label">Cliente</label>
                    <select id="clienteSelect" class="form-select" required>
                        <option value="">Selecione um cliente...</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="veiculoSelect" class="form-label">Veículo</label>
                    <select id="veiculoSelect" class="form-select" required>
                        <option value="">Selecione um veículo...</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="descricao" class="form-label">Descrição</label>
                    <textarea id="descricao" class="form-control" rows="3" required></textarea>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="dataServico" class="form-label">Data do Serviço</label>
                        <input type="date" id="dataServico" class="form-control" required>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label for="quilometragem" class="form-label">Quilometragem Atual (Opcional)</label>
                        <input type="number" id="quilometragem" class="form-control" placeholder="Ex: 50000">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Salvar Serviço</button>
                <button type="button" class="btn btn-secondary" onclick="history.back()">Cancelar</button>
            </form>
        </main>
    </div>

    <div id="loadingOverlay" class="d-none justify-content-center align-items-center" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: 9999;">
            <div class="text-center text-white">
                <div class="spinner-border text-light" role="status" style="width: 4rem; height: 4rem;">
                    <span class="visually-hidden">Carregando...</span>
                </div>
                <h4 class="mt-3">Salvando e enviando e-mail...</h4>
                <p>Por favor, aguarde.</p>
            </div>
        </div>

        <script src="/js/scriptServicosForm.js"></script>
    </body>
</html>
