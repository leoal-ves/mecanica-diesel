<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Veículos - Mecanica Diesel</title>
    <link rel="stylesheet" href="/css/style-home.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-home">
        <div th:replace="~{fragments/componentes :: sidebar}"></div>
        <main class="conteudo-principal">
            <h1>Veículos</h1>
            <div class="mb-4 d-flex align-items-center gap-2">
                <label class="form-label">Filtrar por Cliente:</label>
                <select id="filtroCliente" class="form-select w-25">
                    <option value="">Todos os Clientes</option>
                </select>
            </div>
            <button type="button" class="btn btn-success" onclick="location.href='/veiculos/novo'">Novo Veículo</button>
            <table class="table mt-3">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Cliente</th>
                        <th>Modelo</th>
                        <th>Placa</th>
                    </tr>
                </thead>
                <tbody id="tabelaVeiculosBody"></tbody>
            </table>
        </main>
    </div>
    <script src="/js/scriptVeiculos.js"></script>
</body>
</html>
